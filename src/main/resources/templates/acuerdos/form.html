<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Formulario de acuerdo</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>

<body>

<nav>

    <a th:href="@{/miembros}">
        Miembros
    </a>

    <a th:href="@{/reuniones}">
        Reuniones
    </a>

    <a th:href="@{/acuerdos}">
        Acuerdos
    </a>

    <a th:href="@{/asistencias}">
        Asistencias
    </a>

</nav>

<div class="container">

    <h1 th:text="${acuerdo.id == null
        ? 'Nuevo acuerdo'
        : 'Editar acuerdo'}">
    </h1>

    <form th:action="@{/acuerdos/guardar}"
          th:object="${acuerdo}"
          method="post">

        <input type="hidden"
               th:field="*{id}">


        <label>
            Miembro
        </label>

        <select name="miembroId"
                required>

            <option value="">
                Seleccione un miembro
            </option>

            <option
                    th:each="miembro : ${miembros}"
                    th:value="${miembro.id}"
                    th:text="${miembro.nombres + ' ' + miembro.apellidos}"
                    th:selected="${acuerdo.miembro != null
                    and acuerdo.miembro.id == miembro.id}">
            </option>

        </select>


        <label>
            Reunión
        </label>

        <select name="reunionId"
                required>

            <option value="">
                Seleccione una reunión
            </option>

            <option
                    th:each="reunion : ${reuniones}"
                    th:value="${reunion.id}"
                    th:text="${reunion.titulo + ' - ' + reunion.fecha}"
                    th:selected="${acuerdo.reunion != null
                    and acuerdo.reunion.id == reunion.id}">
            </option>

        </select>

        <label>
            Acuerdo
        </label>

        <textarea
                th:field="*{descripcion}"
                required>
        </textarea>

        <div class="acciones">

            <button class="btn btn-principal"
                    type="submit">
                Guardar
            </button>

            <a class="btn btn-volver"
               th:href="@{/acuerdos}">
                Volver
            </a>

        </div>

    </form>

</div>

</body>

</html>
