<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de miembro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<nav>
    <a th:href="@{/miembros}">Miembros</a>
    <a th:href="@{/reuniones}">Reuniones</a>
</nav>

<div class="container">

    <h1 th:text="${miembro.id == null ? 'Nuevo miembro' : 'Editar miembro'}"></h1>

    <form th:action="@{/miembros/guardar}"
          th:object="${miembro}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <label>Nombres</label>
        <input type="text"
               th:field="*{nombres}"
               required>

        <label>Apellidos</label>
        <input type="text"
               th:field="*{apellidos}"
               required>

        <label>Correo</label>
        <input type="email"
               th:field="*{correo}">

        <label>Teléfono</label>
        <input type="text"
               th:field="*{telefono}">

        <div class="acciones">

            <button class="btn btn-principal"
                    type="submit">
                Guardar
            </button>

            <a class="btn btn-volver"
               th:href="@{/miembros}">
                Volver
            </a>

        </div>

    </form>

</div>

</body>
</html>
