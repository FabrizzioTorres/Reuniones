<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Registrar asistencia</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>


<body>

<nav>

    <a th:href="@{/miembros}">
        Miembros
    </a>

    <a th:href="@{/reuniones}">
        Reuniones
    </a>

    <a th:href="@{/acuerdos}">
        Acuerdos
    </a>

    <a th:href="@{/asistencias}">
        Asistencias
    </a>

</nav>


<div class="container">

    <h1>Registro de Asistencia</h1>

    <h2 th:text="${reunion.titulo}">
    </h2>

    <p>
        Fecha:
        <strong th:text="${reunion.fecha}"></strong>

        |

        Hora:
        <strong th:text="${reunion.hora}"></strong>
    </p>


    <form th:action="@{/asistencias/guardar}"
          method="post">

        <input type="hidden"
               name="reunionId"
               th:value="${reunion.id}">


        <table>

            <thead>

            <tr>
                <th>Miembro</th>
                <th>Estado</th>
            </tr>

            </thead>


            <tbody>

            <tr th:each="miembro : ${miembros}">

                <td>

                    <span
                            th:text="${miembro.nombres + ' ' + miembro.apellidos}">
                    </span>

                    <input type="hidden"
                           name="miembroId"
                           th:value="${miembro.id}">

                </td>


                <td>

                    <select name="estado"
                            required>

                        <option
                                th:each="estado : ${estados}"
                                th:value="${estado}"
                                th:text="${estado}"
                                th:selected="${estadosGuardados[miembro.id] == estado}">
                        </option>

                    </select>

                </td>

            </tr>


            <tr th:if="${#lists.isEmpty(miembros)}">

                <td colspan="2">
                    No existen miembros registrados.
                </td>

            </tr>

            </tbody>

        </table>


        <div class="acciones">

            <button type="submit"
                    class="btn btn-principal">

                Guardar asistencia

            </button>


            <a th:href="@{/asistencias}"
               class="btn btn-volver">

                Volver

            </a>

        </div>

    </form>

</div>

</body>

</html>
